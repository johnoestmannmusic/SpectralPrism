[workspace]
resolver = "2"
members = ["crates/prism_dsp", "crates/prism_cli", "crates/prism_plugin", "xtask"]

[workspace.package]
version = "2026.9.11"
edition = "2021"

# nih-plug is not published on crates.io - pinned to a specific commit so the
# build stays reproducible. Recorded 2026-09-06 from
# https://github.com/robbert-vdh/nih-plug (default branch HEAD at the time).
[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

# Local, patched copy of `baseview` (see vendor/baseview/README.md) fixing
# two real upstream X11-backend bugs - missing keyboard focus acquisition
# and missing detectable-autorepeat - that broke typing in the editor's
# text fields on Linux. Overrides *every* `baseview` dependency sourced
# from this URL in the whole dependency graph, regardless of which git
# revision each dependent (nih-plug's own standalone wrapper vs.
# egui-baseview) originally pinned - Cargo's `[patch]` keys on source URL,
# not revision. Remove this once the fixes land upstream.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }
